<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Nền không gian số Dark Ultra-Deep -->
    <linearGradient id="canvasBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="60%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>

    <!-- Gradient Khối 3D: Mặt Đỉnh (Top Face) -->
    <linearGradient id="topFaceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>

    <!-- Gradient Khối 3D: Mặt Trái (Left Face) -->
    <linearGradient id="leftFaceGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>

    <!-- Gradient Khối 3D: Mặt Phải (Right Face) -->
    <linearGradient id="rightFaceGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4338ca"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>

    <!-- Gradient Mái Nhà Neon Kính Mờ (Glass Roof) -->
    <linearGradient id="neonRoof" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <!-- Gradient Lõi Phòng Hoạt Động (Active Room Glow) -->
    <linearGradient id="activeRoomGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <linearGradient id="goldDot" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <!-- Bộ lọc ánh sáng phát quang Neon -->
    <filter id="ultraGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="shadow3D" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="25" flood-color="#4338ca" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Khung Nền Bo Tròn Chuẩn App Icon -->
  <rect width="512" height="512" rx="128" fill="url(#canvasBg)"/>

  <!-- Vầng sáng Aura ngầm phía sau -->
  <circle cx="256" cy="220" r="130" fill="#6366f1" opacity="0.18" filter="url(#ultraGlow)"/>

  <!-- TOÀN BỘ CẤU TRÚC PHÒNG TRỌ ISOMETRIC 3D -->
  <g filter="url(#shadow3D)">
    
    <!-- 1. KHỐI ĐẾ TÒA NHÀ TẦNG 1 & TẦNG 2 -->
    <!-- Mặt Trái Tòa Nhà -->
    <path d="M140 230 L256 295 L256 385 L140 320 Z" fill="url(#leftFaceGrad)"/>
    <!-- Mặt Phải Tòa Nhà -->
    <path d="M256 295 L372 230 L372 320 L256 385 Z" fill="url(#rightFaceGrad)"/>
    <!-- Mặt Sàn Đỉnh Khối -->
    <path d="M256 165 L372 230 L256 295 L140 230 Z" fill="url(#topFaceGrad)"/>

    <!-- 2. MÁI NHÀ KÍNH PHÁT SÁNG NỔI 3D (FLOATING GLASS ROOF) -->
    <!-- Mái Trái -->
    <path d="M110 185 L256 100 L256 122 L132 195 Z" fill="url(#neonRoof)" opacity="0.9"/>
    <!-- Mái Phải -->
    <path d="M256 100 L402 185 L380 195 L256 122 Z" fill="#0284c7" opacity="0.95"/>
    <!-- Đỉnh Mái Neon Sắc Nét -->
    <path d="M256 94 L410 184 L388 196 L256 118 L124 196 L102 184 Z" fill="url(#neonRoof)" filter="url(#ultraGlow)"/>

    <!-- 3. CÁC Ô CỬA / PHÒNG TRỌ DẠNG MODULE THÔNG MINH (SMART ROOMS) -->
    <!-- Phòng 101 (Mặt Trái - Đang hoạt động) -->
    <path d="M162 250 L200 272 L200 300 L162 278 Z" fill="url(#activeRoomGrad)" filter="url(#ultraGlow)"/>
    <path d="M210 277 L238 293 L238 321 L210 305 Z" fill="#818cf8" opacity="0.6"/>

    <!-- Phòng 201 (Mặt Phải - Đã thanh toán / Phòng xanh) -->
    <path d="M274 293 L302 277 L302 305 L274 321 Z" fill="#10b981" opacity="0.85"/>
    <path d="M312 272 L350 250 L350 278 L312 300 Z" fill="url(#activeRoomGrad)"/>

    <!-- 4. VI MẠCH KẾT NỐI TRUNG TÂM (CHỮ H & CHÌA KHÓA NGẦM) -->
    <!-- Cột cảm biến trung tâm -->
    <line x1="256" y1="120" x2="256" y2="295" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
    <circle cx="256" cy="165" r="7" fill="#ffffff" filter="url(#ultraGlow)"/>
    <circle cx="256" cy="230" r="5" fill="#38bdf8"/>

    <!-- Điểm chấm vàng biểu thị Doanh thu / Quản lý dòng tiền -->
    <circle cx="256" cy="295" r="9" fill="url(#goldDot)" filter="url(#ultraGlow)"/>
  </g>

  <!-- TYPOGRAPHY THƯƠNG HIỆU HOMESTECH SANG TRỌNG -->
  <text x="256" y="434" font-family="'Inter', -apple-system, sans-serif" font-weight="900" font-size="34" fill="#ffffff" text-anchor="middle" letter-spacing="6">HOMESTECH</text>
  <text x="256" y="460" font-family="'Inter', -apple-system, sans-serif" font-weight="700" font-size="12" fill="#818cf8" text-anchor="middle" letter-spacing="3">SMART PMS 2026</text>
</svg>
